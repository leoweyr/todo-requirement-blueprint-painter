<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>TODO Requirement Blueprint Painter Icon</title>

  <defs>
    <linearGradient id="appStoreBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ca5fd" />
      <stop offset="100%" stop-color="#0273e1" />
    </linearGradient>

    <linearGradient id="infraDebtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="touchpointCashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
    </pattern>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background: App Store Blue with Blueprint Grid -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#appStoreBlue)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#grid)"/>

  <!-- Main Diagonal Composition: Top-Left to Bottom-Right -->
  <g transform="translate(0, 0)">
    <!-- Connection (Edge) -->
    <!-- Diagonal Line connecting centers -->
    <line x1="120" y1="120" x2="392" y2="392" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Evolution Arc (History) -->
    <!-- Arcing above the main line - White/Light Purple -->
    <path d="M120 120 Q 300 80 392 392" stroke="#e9d5ff" stroke-width="8" stroke-dasharray="16 10" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Upstream Node: Infrastructure (Liability/Debt) - Top Left -->
    <!-- Visual: Red Block, heavy, represents Cost Center -->
    <rect x="60" y="60" width="120" height="120" rx="28" fill="url(#infraDebtGradient)" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>

    <!-- Icon: Server Rack (Cost) -->
    <!-- Unit 1 -->
    <rect x="80" y="80" width="80" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="150" cy="90" r="3" fill="#ef4444"/> <!-- Status Light -->
    <rect x="85" y="85" width="40" height="10" rx="2" fill="#cbd5e1"/> <!-- Vent/Drive -->
    <!-- Unit 2 -->
    <rect x="80" y="110" width="80" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="150" cy="120" r="3" fill="#ef4444"/>
    <rect x="85" y="115" width="40" height="10" rx="2" fill="#cbd5e1"/>
    <!-- Unit 3 -->
    <rect x="80" y="140" width="80" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="150" cy="150" r="3" fill="#ef4444"/>
    <rect x="85" y="145" width="40" height="10" rx="2" fill="#cbd5e1"/>

    <!-- Downstream Node: Touchpoint (Cash Flow/Value) - Bottom Right -->
    <!-- Visual: Gold Block, bright, represents Revenue Center -->
    <rect x="332" y="332" width="120" height="120" rx="28" fill="url(#touchpointCashGradient)" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
    <!-- Icon: Dollar Coin ($) -->
    <circle cx="392" cy="392" r="36" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.95"/>
    <path d="M392 366 V418 M404 382 C404 374 398 374 392 374 C376 374 376 388 392 392 C408 396 408 410 392 410 C380 410 380 402 380 402" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" stroke-linejoin="round"/>

    <!-- Demand Arrow (Pointing Up-Left: Value pulls Infrastructure) -->
    <!-- STRICTLY aligned to diagonal. Tip(210,210), Base(250,250) +/- 15 perp -->
    <path d="M210 210 L265 235 L235 265 Z" fill="#2ca5fd" stroke="#2ca5fd" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Painter Tool (Apple Pencil Style) -->
  <!-- Extended length, tip touches the line -->
  <g transform="translate(370, 70) rotate(35)">
     <!-- Shadow -->
     <rect x="2" y="2" width="22" height="130" rx="4" fill="#000000" opacity="0.15"/>
     <!-- Body -->
     <rect x="0" y="0" width="22" height="130" rx="11" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
     <!-- Silver band/Tip section -->
     <rect x="0" y="115" width="22" height="15" fill="#e2e8f0" />
     <!-- Nib -->
     <path d="M0 130 L22 130 L11 155 Z" fill="#cbd5e1" />
     <!-- Highlight -->
     <rect x="5" y="5" width="4" height="120" rx="2" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
